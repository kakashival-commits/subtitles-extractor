name: Extract Subtitles

on:
  workflow_dispatch:
  repository_dispatch:
    types: [start_subtitle_extraction]

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system packages and tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mkvtoolnix rclone fuse3 -qq
          pip install pysrt groq requests

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONFIG }}
          EOF

      - name: Mount Google Drive (Torrents folder)
        run: |
          mkdir -p "$HOME/gdrive"
          rclone mount gdrive:Torrents "$HOME/gdrive" --vfs-cache-mode writes --daemon
          sleep 5

      - name: Run extraction script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GDRIVE_DIR: ${{ runner.temp }}/../gdrive
        run: |
          python3 extract_subs.py

      - name: Sync subtitles back to Drive
        if: always()
        run: |
          rclone copy "$HOME/gdrive" gdrive:Torrents --include "*.srt" --include "*.vtt"

      - name: Telegram notification
        if: always()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=✅ GitHub Actions: Обробку субтитрів у папці Torrents завершено!"
